version: "3.7"
services:
  grafana:
    image: grafana/grafana-oss:latest
    container_name: ceren-grafana-fix
    ports:
      - "3000:3000"
    volumes:
      # dist klasörünü eklenti olarak bağlıyoruz
      - ./dist:/var/lib/grafana/plugins/cerenaktar-cerendatasource-datasource
      # ayar dosyasını içeri atıyoruz
      - ./provisioning:/etc/grafana/provisioning
    environment:
      - GF_LOG_LEVEL=debug
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=cerenaktar-cerendatasource-datasource